version: '3'

vars:
  APP_NAME: "Resolve Sync"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml


tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  tools:
    summary: Builds the tools shipped inside the app (ffmpeg, ffprobe, Blackmagic RAW helper)
    cmds:
      - task: tools:ffmpeg
      - task: tools:braw

  tools:ffmpeg:
    summary: Builds LGPL ffmpeg and ffprobe into tools/bin
    status:
      - test -x tools/bin/ffmpeg && test -x tools/bin/ffprobe
    cmds:
      - ./scripts/build-ffmpeg.sh

  tools:braw:
    summary: Builds the Blackmagic RAW helper into tools/bin (needs the Blackmagic RAW SDK)
    sources:
      - braw/*.cpp
    generates:
      - tools/bin/brawframes
    cmds:
      - ./scripts/build-braw.sh

  cli:
    summary: Builds the command-line tool
    cmds:
      - go build -o resolve-sync ./cmd/resolve-sync

  test:
    summary: Runs the Go tests
    cmds:
      - go test ./...
